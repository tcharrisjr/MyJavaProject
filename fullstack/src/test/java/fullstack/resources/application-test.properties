# ==========================================================
# TEST PROFILE
# ==========================================================
#
# Integration tests use an isolated H2 in-memory database.
#
# Tests therefore do NOT depend on:
#
# - SQL Server being available
# - SQL Server credentials
# - production environment variables
# - the FullStackDemo development database
#
# ==========================================================


# ==========================================================
# DATABASE
# ==========================================================

spring.datasource.url=jdbc:h2:mem:fullstacktest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE

spring.datasource.driver-class-name=org.h2.Driver

spring.datasource.username=sa

spring.datasource.password=


# ==========================================================
# JPA / HIBERNATE
# ==========================================================

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.jpa.hibernate.ddl-auto=create-drop

spring.jpa.show-sql=false

spring.jpa.open-in-view=false


# ==========================================================
# JWT - TEST ONLY
# ==========================================================
#
# Valid Base64 test key.
# This is intentionally a TEST credential only.
# Never use this value in production.
#
# ==========================================================

app.jwt.secret=VGhpcy1pcy1hLXRlc3Qtc2VjcmV0LWtleS10aGF0LWlzLWxvbmc=

app.jwt.expiration-ms=86400000


# ==========================================================
# CORS - TEST
# ==========================================================

app.cors.allowed-origins=http://localhost:5173