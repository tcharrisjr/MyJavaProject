# ==========================================================
# APPLICATION
# ==========================================================

spring.application.name=fullstack


# ==========================================================
# DATABASE - DEVELOPMENT / TEST DEFAULTS
# ==========================================================
#
# These values support local development and the current
# Spring Boot integration tests.
#
# Environment variables may override the local defaults.
#
# Production-specific configuration is located in:
#
#     application-prod.properties
#
# ==========================================================

spring.datasource.url=${DB_URL:jdbc:sqlserver://GWNR7L1749:1422;databaseName=FullStackDemo;encrypt=true;trustServerCertificate=true}

spring.datasource.username=${DB_USERNAME:fullstackuser}

spring.datasource.password=${DB_PASSWORD:YOUR_NEW_LOCAL_PASSWORD}

spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver


# ==========================================================
# JPA / HIBERNATE
# ==========================================================
#
# Development uses "update" so Hibernate can update the
# local development schema as entity definitions change.
#
# Production overrides this behavior and should normally
# use schema validation instead.
#
# ==========================================================

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

spring.jpa.show-sql=${JPA_SHOW_SQL:true}

# Disable Open Session in View.
#
# Database access should occur inside the service /
# persistence layer rather than during response rendering.

spring.jpa.open-in-view=false


# ==========================================================
# JWT AUTHENTICATION - DEVELOPMENT / TEST
# ==========================================================
#
# The value below is a DEVELOPMENT / TEST fallback only.
#
# When JWT_SECRET exists as an environment variable,
# Spring automatically uses that value instead.
#
# Production configuration requires JWT_SECRET and does
# not rely on this development fallback.
#
# ==========================================================

app.jwt.secret=${JWT_SECRET:6LRwTSeKVrJdlI8z/KAoOuVJ6UDo9UYoyP52k8RhulU=}


# ==========================================================
# JWT EXPIRATION
# ==========================================================
#
# Default:
#
#     86,400,000 milliseconds
#     = 24 hours
#
# Can be overridden with:
#
#     JWT_EXPIRATION_MS
#
# ==========================================================

app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}


# ==========================================================
# CORS - DEVELOPMENT / LOCAL PREVIEW
# ==========================================================
#
# Development Vite servers:
#
#     http://localhost:5173
#     http://localhost:5174
#     http://localhost:5175
#     http://localhost:5176
#
# Vite production preview servers:
#
#     http://localhost:4173
#     http://localhost:4174
#
# Production overrides this through:
#
#     APP_CORS_ALLOWED_ORIGINS
#
# ==========================================================

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://localhost:4173,http://localhost:4174}